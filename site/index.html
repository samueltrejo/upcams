<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08100f" />
    <title>Protect Camera Wall</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #070b0b;
        --surface: #0d1312;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f2f5f4;
        --muted: #8e9b98;
        --live: #75e6b5;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 15% -10%, rgba(37, 103, 80, 0.22), transparent 34rem),
          var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        min-height: 76px;
        padding: 18px clamp(18px, 3vw, 40px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(117, 230, 181, 0.28);
        border-radius: 11px;
        background: rgba(117, 230, 181, 0.08);
        color: var(--live);
        font-size: 15px;
      }

      h1 {
        margin: 0;
        font-size: clamp(17px, 2vw, 21px);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .clock {
        color: var(--muted);
        font: 500 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      main {
        min-height: calc(100vh - 77px);
        padding: clamp(12px, 2vw, 24px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(220px, 1fr));
        gap: clamp(10px, 1.4vw, 18px);
      }

      .camera {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 260px;
        display: block;
        border: 0;
        background: #000;
      }

      .label {
        position: absolute;
        z-index: 2;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 999px;
        background: rgba(7, 11, 11, 0.72);
        backdrop-filter: blur(12px);
        font-size: 12px;
        font-weight: 620;
        pointer-events: none;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 0 4px rgba(117, 230, 181, 0.12);
      }

      .expand {
        position: absolute;
        z-index: 3;
        right: 12px;
        bottom: 12px;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 11px;
        background: rgba(7, 11, 11, 0.74);
        color: white;
        cursor: pointer;
        backdrop-filter: blur(12px);
      }

      .expand:hover { background: rgba(22, 31, 29, 0.92); }
      .expand:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

      @media (max-width: 760px) {
        header { min-height: 68px; }
        .subtitle { display: none; }
        main { grid-template-columns: 1fr; grid-template-rows: none; }
        .camera { min-height: 52vw; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">●</div>
        <div>
          <h1>Protect Camera Wall</h1>
          <p class="subtitle">Four live feeds · local network only</p>
        </div>
      </div>
      <time class="clock" id="clock"></time>
    </header>

    <main id="camera-grid" aria-label="Live camera feeds"></main>

    <script>
      const cameras = [
        { id: "camera1", name: "Camera 1" },
        { id: "camera2", name: "Camera 2" },
        { id: "camera3", name: "Camera 3" },
        { id: "camera4", name: "Camera 4" },
      ];

      // Camera feeds are proxied through the same HTTPS origin. This avoids
      // mixed-content errors and keeps MediaMTX/RTSP ports off the LAN.
      const mediaHost = location.origin;
      const grid = document.querySelector("#camera-grid");

      for (const camera of cameras) {
        const card = document.createElement("section");
        card.className = "camera";
        card.innerHTML = `
          <div class="label"><span class="dot"></span>${camera.name}</div>
          <iframe
            title="${camera.name} live feed"
            src="${mediaHost}/${camera.id.replace("camera", "cam")}/?controls=false&muted=true&autoplay=true&playsInline=true&disablepictureinpicture=true"
            allow="autoplay; fullscreen"
            scrolling="no"
          ></iframe>
          <button class="expand" type="button" aria-label="Open ${camera.name} fullscreen">⛶</button>
        `;

        card.querySelector(".expand").addEventListener("click", () => {
          if (card.requestFullscreen) card.requestFullscreen();
        });
        grid.appendChild(card);
      }

      const clock = document.querySelector("#clock");
      const updateClock = () => {
        clock.dateTime = new Date().toISOString();
        clock.textContent = new Intl.DateTimeFormat(undefined, {
          weekday: "short",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
        }).format(new Date());
      };
      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
